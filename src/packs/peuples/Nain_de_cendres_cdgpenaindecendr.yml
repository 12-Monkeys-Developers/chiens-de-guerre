_id: cdgpenaindecendr
name: Nain de cendres
type: peuple
img: icons/environment/people/group.webp
system:
  description: >-
    <p>Les nains de cendres ont trahi leurs pairs en acceptant de commercer avec
    Tol-Amoth pendant la guerre. En renonçant à leur promesse, ils ont rompu
    l'eïpimor, l'affinité mystique qui les lie aux leurs, et perdu leur
    immortalité au profit de l'individualité. Leur physique tient désormais plus
    de l'ardoise poussiéreuse que du granit, d'où leur surnom.</p>
