_id: cdgpeorque000000
name: Orque
type: peuple
img: icons/environment/people/group.webp
system:
  description: >-
    <p>Les orques n'existent que depuis peu : créés artificiellement par
    Tol-Amoth pour servir de combattants, ils furent pourchassés et exterminés à
    la fin de la guerre. Éduqués uniquement pour la guerre, ils passent pour
    sauvages et stupides ; ceux qui ont survécu font pourtant preuve de
    capacités intellectuelles semblables à celles des autres peuples.<p><em>Un
    orque ne parle que le stygien. Il est vivement conseillé de dépenser des
    points de personnalisation pour acquérir une autre langue.</em></p></p>
