system:
  description: >-
    <p>Les elfes forment un peuple végétal dont chaque individu est lié à un
    arbre. Quelques-uns, sur le point de mourir, nouèrent un pacte avec
    Tol-Amoth et survécurent à la destruction de leur Arbre-Vie, devenant des
    morts-vivants dont la chair végétale semble littéralement pourrir. Ils sont
    honnis et pourchassés par leur peuple.</p>
