system:
  description: >-
    <p>Peuple humain du sud occupant les terres arides du royaume d'Escannie. On
    les considère souvent comme mystérieux, exotiques et cultivés. Neutres au
    début de la guerre, ils rejoignirent Tol-Amoth par opportunisme en plein
    milieu du conflit, à la surprise générale.<p><em>Les Escanniens parlent une
    troisième langue, au choix du joueur : elle n'est pas listée ici,
    puisqu'elle varie d'un personnage à l'autre.</em></p></p>
