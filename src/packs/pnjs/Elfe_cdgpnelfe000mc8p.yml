  details:
    description: >-
      <p>Les elfes sont des humanoïdes végétaux dotés d’une espérance de vie de
      plusieurs siècles. Ils vivent principalement sur les îles de Vagnes,
      qu’ils ne quittent que rarement. Ceux qui ont été corrompus par Tol-Amoth
      sont des morts-vivants connus sous le nom d’« elfes putrides », qui ne
      peuvent être définitivement détruits sans avoir recours au feu ou à
      d’autres moyens du même acabit.</p>
