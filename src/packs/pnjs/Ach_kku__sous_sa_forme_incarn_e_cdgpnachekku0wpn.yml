  details:
    description: >-
      <p>Anciens, immatériels et malveillants, les Daemons sont de purs esprits
      qui se nourrissent des émotions fortes des mortels. Ils tentent, trompent
      et avilissent ceux qui ont la faiblesse de les croire ou, simplement, de
      les écouter. Ils cherchent par tous les moyens à s’incarner sur les Terres
      doyennes où, l’espace d’un instant, ils pourront semer le chaos et la
      destruction. Chaque Daemon est unique aussi bien dans ses pulsions que
      dans ses capacités surnaturelles. Leur forme incarnée, qu’ils ne peuvent
      jamais conserver bien longtemps, est à la fois terrifiante et redoutable.
      Quoiqu’ils fussent autrefois les serviteurs d’Obémon, ils sont depuis
      longtemps devenus leurs propres maîtres et poursuivent des objectifs
      connus d’eux seuls.</p><p>Achëkku est attiré par les individus offensés, à
      l’honneur bafoué ou victimes d’abus — et ce d’autant plus s’ils sont
      incapables de se faire justice par leurs propres moyens. Il s’immisce dans
      leurs pensées et leurs songes, les forçant sans cesse à revivre leurs
      traumas et à ruminer leurs frustrations. Il décuple leur colère, aiguise
      leur haine, affine leurs scénarios de vengeance. Lorsqu’enfin ses victimes
      passent à l’acte, il leur insuffle une force et une détermination
      surnaturelles. Sous son emprise, les vengeances tournent au bain de sang
      et créent de nouvelles injustices. Bientôt, les vendettas s’enchaînent et
      des communautés entières basculent dans des représailles sanglantes dont
      plus personne ne connaît l’origine.</p><p>Gorgé de frustration et de
      haine, Achëkku peut enfin se manifester dans le monde physique, le plus
      souvent sous la forme d’un homme gigantesque à tête de sanglier, à la
      musculature surdéveloppée. Il se livre alors à des massacres aveugles
      jusqu’à ce que, faute de victimes, il doive retourner dans le monde
      spirituel. Achëkku fait l’objet d’un culte mineur (mais interdit) en Tuhée
      où des godar offrent sa protection aux victimes en quête de revanche.</p>
