  details:
    description: >-
      <p>Les stryges sont des prédateurs retors qui pourraient être le résultat
      d’accouplements entre Daemons et humains, ou entre vampires et mortels.
      Mi-femmes, mi-oiseaux, leurs serres sont acérées, leurs ailes sont faites
      de cuir et leur langue est fourchue ; pourtant, elles sont d’une beauté
      enivrante et peuvent aisément faire chavirer le cœur des hommes. Les
      stryges raffolent de la chair humaine et spécialement de celle des
      nouveaux-nés, qu’elles enlèvent pour s’en délecter. Elles sont
      inhumainement rusées, peuvent prendre une apparence humaine et parlent
      toutes les langues.</p>
    notes: ''
    special: >-
      <p>Une stryge peut à volonté prendre l’apparence d’une superbe femme «
      normale ». Il s’agit d’une illusion que seule la magie peut percer.</p>
