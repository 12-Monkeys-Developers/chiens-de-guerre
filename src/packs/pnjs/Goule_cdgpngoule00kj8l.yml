  details:
    description: >-
      <p>Les goules sont d’anciens hommes pervertis par une sombre magie. Bien
      qu’elles ne soient pas à proprement parler des morts-vivants, les goules
      sont des créatures répugnantes qui se tiennent voûtées, le corps déformé
      et maladif, à la pilosité éparse et effilochée. Elles sont strictement
      nécrophages et tiraillées par une faim insatiable. Elles affectionnent
      particulièrement les cimetières et autres nécropoles. D’une intelligence à
      peine plus élevée qu’un animal, elles sont très territoriales et
      agressives.</p>
    notes: ''
    special: >-
      <p>Leurs griffes crasseuses sont vectrices de maladie. À la moindre
      blessure, leur victime doit réussir un test de Corps / Vigueur ou
      contracter une infection à la discrétion du MJ, comme par exemple la
      mortiphose.</p>
