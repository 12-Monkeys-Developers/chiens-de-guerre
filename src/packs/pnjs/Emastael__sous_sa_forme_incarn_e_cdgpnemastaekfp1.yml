  details:
    description: >-
      <p>Emastael cherche pour victimes des hommes ou des femmes respectables,
      amoureux, fidèles et vertueux. Il exacerbe en eux les désirs charnels
      inavoués et leur confère une attraction sans précédent. Il se délecte du
      lent effritement de leurs principes moraux jusqu’au jour où ils se livrent
      enfin à l’adultère. La victime s’enfonce alors chaque jour plus
      profondément dans la lubricité tout en maintenant son ancienne façade de
      respectabilité. Lorsqu’elle n’est guère plus que le jouet de ses propres
      pulsions, le Daemon la pousse à fonder une société secrète dédiée aux
      plaisirs charnels et interdits.</p><p>Bientôt le groupuscule finit par
      vouer un culte à Emastael qui, en retour, leur procure réussite sociale et
      succès en amour. Lorsque la communauté est suffisamment établie, le Daemon
      s’incarne au cours d’une orgie rituelle. Dès lors, il ne subsiste que par
      l’absorption de l’énergie sexuelle de ses fidèles, ce qui leur est fatal.
      Plus le temps passe et plus il devient gourmand en vies, ce qui finit
      invariablement par le forcer à se retirer du monde physique, faute de
      sacrifices suffisants. Sous sa forme matérielle, Emastael se présente
      comme un individu androgyne à la beauté troublante, doté de griffes
      rétractiles et d’une queue de scorpion.</p>
    notes: ''
    special: >-
      <p>Le dard d’Emastael peut délivrer un poison, à l’instar d’un ungys (cf.
      p. 72).</p>
