  details:
    description: >-
      <p>Les soldats, qu’ils soient mercenaires ou de métier, forment le noyau
      dur des bandes militaires. C’est aussi le profil typique des miliciens et
      autres agents de l’ordre. Ces combattants professionnels disposent d’une
      formation solide et d’équipements corrects. La plupart du temps ils
      manient des épées ou lances en combinaison avec un bouclier et sont
      protégés de cottes matelassées ou d’armures de cuir.</p>
