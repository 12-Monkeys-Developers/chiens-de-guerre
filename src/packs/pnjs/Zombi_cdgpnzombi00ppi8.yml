  details:
    description: >-
      <p>Les cadavres réanimés par les sombres arts de la nécromancie sont des
      visions d’horreur. Décérébrés, lents, ils font preuve d’une force
      surnaturelle et sont virtuellement infatigables. Certains sont créés par
      l’Arcanum Mortem. Une poignée de zombis ne forme pas une grande menace
      pour des combattants aguerris, mais ils peuvent s’avérer redoutables en
      grands groupes.</p>
    notes: ''
    special: >-
      <p>Face à tout dommage non tranchant (dégâts contondants ou perforants,
      par exemple), la protection d’un zombi passe à 3.</p>
