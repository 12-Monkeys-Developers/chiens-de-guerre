        sévices, que ce soit la fatigue, la faim, la soif ou la
        torture.</p><h4>Balance / Obscurité</h4><p>Le Marqué bénéficie par
        ailleurs d’un bonus de + 1 par rang sur tous les tests visant à résister
        aux effets des maladies ou des poisons.</p>
