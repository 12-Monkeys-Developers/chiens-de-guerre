  details:
    description: >-
      <p>Les vampires sont de puissants revenants accablés par une terrible
      malédiction. Contrairement à la plupart des morts-vivants, ils conservent
      leur intellect et leur volonté, ce qui, combiné à leur immortalité, leur
      laisse tout le loisir de se perfectionner et d’échafauder des plans
      complexes qui s’étalent sur plusieurs siècles. Autrefois humains, ils ne
      peuvent subsister qu’en consommant le sang frais de leurs victimes. Les
      vampires évoluent la nuit et supportent mal la lumière de l’astre solaire.
      Bien nourris, leur teint frais et rosé leur permet de passer pour de
      simples humains. On suspecte qu’une partie de la noblesse darguanite soit
      infiltrée par ces terribles prédateurs.</p>
