  details:
    description: >-
      <p>Les lindwurms sont de cauchemardesques lézards géants quadrupèdes de 6
      mètres au garrot pour quelque 6 tonnes. Heureusement rarissimes, on ne les
      trouve guère qu’en Adutatonnie et dans le pays de Tuhée. Contrairement aux
      mythiques dragons, ils n’ont pas d’ailes. Les Oblitérés réussirent à en
      asservir quelques-uns pendant la Guerre d’oppression pour en faire
      d’incroyables machines de guerre.</p>
