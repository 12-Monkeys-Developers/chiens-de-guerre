  details:
    description: >-
      <p>Les trolls sont des créatures monstrueuses très grandes, en général de
      3 mètres de haut, à l’intelligence limitée, proche de celle d’un chien.
      Les trolls furent créés par Tol-Amoth peu avant les orques et servirent
      comme troupes d’assaut lors de la Guerre d’oppression. Ils étaient
      généralement dressés par des Marqués spécialisés dans cette tâche.
      Quelques rares compagnies franches élèvent encore de telles créatures,
      mais la plupart sont devenues sauvages. Les trolls régénèrent leurs
      blessures et sont incroyablement difficiles à tuer. Ils ne parlent pas
      mais peuvent comprendre des ordres simples en stygien.</p>
