    img: icons/magic/symbols/runes-star-blue.webp
    system:
      description: >-
        <p>En développant Induratus, un Marqué peut endurer des coups terribles
        sans subir la moindre éraflure, mais aussi résister aux pires épreuves.
        Pour chaque rang possédé dans cet Arcanum, le personnage bénéficie d’un
        + 2 à tous les tests de résistance aux
        dommages.</p><h4>Lumière</h4><p>Le Marqué gagne en outre un bonus de + 1
