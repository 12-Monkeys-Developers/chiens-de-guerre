  details:
    description: >-
      <p>Les garguants sont des boucs géants utilisés par les nains comme
      montures ou animaux de bât. Quoique lents, ils sont très à l’aise en
      montagne et peuvent supporter des charges impressionnantes. Bien que leur
      mauvais caractère soit légendaire, il est impossible de les dresser pour
      le combat. Les garguants domestiqués sont très rares en dehors des
      communautés naines.</p>
