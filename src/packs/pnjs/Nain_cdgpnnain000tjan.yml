  details:
    description: >-
      <p>Les nains sont des humanoïdes de petite taille, semblables à des
      statues animées, à la peau noire d’ébène. Ils sont immortels (insensibles
      au vieillissement), dirigés par un esprit de ruche (l’eïpimor) et
      incapables de mentir. Ceux qui ont été corrompus par Tol-Amoth sont nommés
      « nains de cendres » et présentent un teint poussiéreux.</p>
