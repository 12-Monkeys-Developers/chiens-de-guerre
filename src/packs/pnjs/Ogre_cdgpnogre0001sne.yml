  details:
    description: >-
      <p>Parfois confondus à tort avec les trolls, les ogres sont des créatures
      humanoïdes semblables à de gigantesques hommes dégénérés. Les ogres, hauts
      d’environ 2,5 à 3 mètres, ont une musculature puissante et vivent
      généralement en petites cellules familiales de quelques individus. Ils
      sont primitifs, brutaux et gourmands. Strictement carnivores, ils passent
      le plus clair de leur temps à chasser et ne rechignent absolument pas à
      consommer de la chair humaine, dont ils sont même friands. Ils tendent
      souvent des embuscades aux voyageurs infortunés. Les ogres baragouinent
      une variante du stygien.</p>
