  details:
    description: >-
      <p>Les squelettes sont des morts-vivants ayant perdu toute chair putréfiée
      et dont les os sont maintenus par une magie impie. On ignore s’il s’agit
      de zombis très anciens ou d’une branche de la nécromancie connue des seuls
      Oblitérés. Les squelettes sont étonnamment rapides et adroits. Ils font
      preuve d’une certaine intelligence, ou, pour être plus exact, d’une
      malignité certaine.</p>
    notes: ''
    special: >-
      <p>Face à tout dommage non contondant (dégâts tranchants ou perforants,
      par exemple), la protection d’un squelette passe à 3.</p>
