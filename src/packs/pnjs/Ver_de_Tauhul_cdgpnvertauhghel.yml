  details:
    description: >-
      <p>Nul ne sait si les vers de Tauhul sont des créatures naturelles ou des
      monstres engendrés par les cataclysmes magiques qui ont secoué l’Ethémor.
      Le ver de Tauhul est une créature annelée de 5 à 6 mètres de long pour un
      diamètre de 30 cm, au corps mou et à la mâchoire puissante. Il vit
      principalement en Ethémor et au pays de Tuhée. Le ver de Tauhul creuse un
      terrier dans le sol meuble où il demeure immobile, dans l’attente d’une
      proie. Il surgit alors de terre comme un diable à ressort hors de sa boîte
      et plante ses mâchoires surpuissantes dans les chairs de ses victimes. Il
      peut s’attaquer ainsi à de grandes proies, dont font partie les
      hommes.</p>
