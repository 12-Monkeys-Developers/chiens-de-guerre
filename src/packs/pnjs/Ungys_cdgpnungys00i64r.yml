    system:
      description: >-
        <p>L’Arcanum Devito se concentre sur l’art de la dérobade en se basant
        sur le leurre et sur des prouesses physiques surnaturelles, telles que
        des sauts périlleux, des esquives acrobatiques ou des roulés-boulés.
        Pour chaque rang possédé dans cet Arcanum, le personnage bénéficie d’un
        + 2 à tous les tests d’esquive.</p><h4>Lumière / Balance</h4><p>Le
        Marqué gagne en outre un bonus de + 1 par rang sur tous les tests
        d’Acrobatie, tels que les sauts périlleux, les pirouettes ou le maintien
        de l’équilibre. Ce bonus s’applique en particulier aux tests visant à
        limiter les dégâts d’une chute.</p><h4>Obscurité</h4><p>Le Marqué
        bénéficie par ailleurs d’un bonus de + 1 par rang sur tous les tests de
        discrétion, que ce soit pour passer inaperçu ou pour dissimuler un objet
        sur lui.</p>
