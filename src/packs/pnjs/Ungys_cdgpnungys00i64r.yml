  details:
    description: >-
      <p>Les ungys sont des créatures volantes créées de toutes pièces par
      Tol-Amoth, à l’instar des orques et des trolls. Les ungys ont servi de
      montures ailées aux Oblitérés et à quelques rares Marqués pendant la
      Guerre d’oppression. Un ungys adulte ressemble à un lézard géant doté
      d’ailes membraneuses, pour une envergure d’environ 6 mètres, au corps
      plutôt fin, doté d’un bec garni de dents et à la couleur variant entre le
      gris cendré et le noir de jais. Sa longue queue se termine par un dard
      empoisonné. Ces animaux sont difficiles à dresser et particulièrement
      traîtres. La grande majorité de l’espèce a été massacrée et il n’en reste
      que de rares (et précieux) spécimens.</p>
    notes: ''
    special: >-
      <p>Les Arcanums d’un ungys ne s’appliquent que pendant le vol (ou le
      piqué).</p><p>Le dard d’un ungys peut délivrer environ une fois par jour
      un poison mortel. La victime doit alors faire un test de Corps / Vigueur
      :</p><ul><li><strong>Réussite critique :</strong> le personnage coche une
      case de blessure légère.</li><li><strong>Réussite :</strong> le personnage
      coche une case de blessure grave.</li><li><strong>Échec :</strong> le
      personnage coche une case de blessure grave et se met à convulser. S’il ne
      reçoit pas les soins nécessaires dans la minute qui suit (réussite d’un
      test d’Esprit / Médecine), il coche en plus une case de blessure
      mortelle.</li><li><strong>Échec critique :</strong> le personnage coche
      une case de blessure mortelle et se met à convulser… s’il vit encore
      (mêmes effets supplémentaires après une minute que l’échec
      ci-dessus).</li></ul>
