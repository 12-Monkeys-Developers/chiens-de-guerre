_id: cdgGuide77vg8wUz
name: Guide du système
pages:
  - _id: TWCq1YGI98mlv6ez
    name: Introduction
    type: text
    title:
      show: false
      level: 1
    image: {}
    text:
      format: 1
      content: |-
        <div class="cdg-guide">
          <h2>Bienvenue dans la compagnie</h2>
          <p>
            Ce guide présente ce que le système <strong>Chiens de guerre</strong> pour Foundry VTT met à votre disposition : l'assistant de création des Marqués, la fiche
            de personnage, les PNJ et créatures, la compagnie franche et ses batailles, les tests à poignée de d20 et le combat en confrontation. Il ne remplace pas le livre de règles : il
            explique comment Foundry vous aide à les appliquer.
          </p>
          <p>Le système nécessite <strong>Foundry VTT V14</strong>.</p>

          <h3>Sommaire</h3>
          <ul>
            <li>@UUID[Compendium.chiens-de-guerre.guide.JournalEntry.cdgGuide77vg8wUz.JournalEntryPage.GmNyKHhl8NNxO3ep]{Réglages} : les réglages du monde.</li>
            <li>@UUID[Compendium.chiens-de-guerre.guide.JournalEntry.cdgGuide77vg8wUz.JournalEntryPage.2wzFoVxI1eErVbzz]{Créer un Marqué} : l'assistant de création de personnage, en neuf étapes.</li>
            <li>@UUID[Compendium.chiens-de-guerre.guide.JournalEntry.cdgGuide77vg8wUz.JournalEntryPage.uzA4Ui46yz5MRj5Z]{La fiche de personnage} : la fiche, onglet par onglet, et le dépôt d'un peuple, d'une carrière ou d'une ascendance.</li>
            <li>@UUID[Compendium.chiens-de-guerre.guide.JournalEntry.cdgGuide77vg8wUz.JournalEntryPage.Bd0TlcBOLfPaZzt9]{Objets et origines} : équipement, arcanums, traits spéciaux et effets, peuples, carrières, ascendances.</li>
            <li>@UUID[Compendium.chiens-de-guerre.guide.JournalEntry.cdgGuide77vg8wUz.JournalEntryPage.Mhbx3hlIt28jYB7U]{PNJ et créatures} : la fiche de PNJ et le bestiaire.</li>
            <li>@UUID[Compendium.chiens-de-guerre.guide.JournalEntry.cdgGuide77vg8wUz.JournalEntryPage.atUkWWFtqc9vxOlx]{La compagnie franche} : l'assistant et la fiche de la compagnie franche.</li>
            <li>@UUID[Compendium.chiens-de-guerre.guide.JournalEntry.cdgGuide77vg8wUz.JournalEntryPage.IVgxzdiSc9kXDRd9]{Les tests} : la fenêtre de test, la poignée de dés, la carte de résultat et le dépassement.</li>
            <li>@UUID[Compendium.chiens-de-guerre.guide.JournalEntry.cdgGuide77vg8wUz.JournalEntryPage.GdA29X6mS3ScAj1f]{Le combat} : le suivi de combat, l'initiative, la confrontation et le personnage mourant.</li>
            <li>@UUID[Compendium.chiens-de-guerre.guide.JournalEntry.cdgGuide77vg8wUz.JournalEntryPage.Bt7kQw2RzN4xLm9c]{Les batailles} : la fenêtre de bataille de la compagnie, phase par phase, et la table des adversaires.</li>
            <li>@UUID[Compendium.chiens-de-guerre.guide.JournalEntry.cdgGuide77vg8wUz.JournalEntryPage.d6qJxIR42RlaHXOi]{Macros et outils du meneur} : la barre de macros et le tableau de bord du meneur.</li>
          </ul>

          <h2>L'onglet du système</h2>
          <div class="guide-row">
            <div class="guide-image guide-image-narrow"><img src="systems/chiens-de-guerre/assets/guide/barre-laterale.webp" alt="Onglet Chiens de guerre de la barre latérale" /></div>
            <div>
              <p>
                Le système ajoute un onglet à la barre latérale, marqué d'un étendard <i class="fa-solid fa-flag-swallowtail"></i>. Il rassemble les points d'entrée des outils du système :
              </p>
              <ul>
                <li><strong>Tableau de bord des joueurs</strong> (meneur seulement) : l'état des personnages des joueurs connectés, voir @UUID[Compendium.chiens-de-guerre.guide.JournalEntry.cdgGuide77vg8wUz.JournalEntryPage.d6qJxIR42RlaHXOi]{Macros et outils du meneur} ;</li>
                <li><strong>Ouvrir la bataille</strong> : la fenêtre de bataille d'une compagnie franche, voir @UUID[Compendium.chiens-de-guerre.guide.JournalEntry.cdgGuide77vg8wUz.JournalEntryPage.Bt7kQw2RzN4xLm9c]{Les batailles} ;</li>
                <li><strong>Création de personnage</strong> : l'assistant qui guide la création d'un Marqué, voir @UUID[Compendium.chiens-de-guerre.guide.JournalEntry.cdgGuide77vg8wUz.JournalEntryPage.2wzFoVxI1eErVbzz]{Créer un Marqué} ;</li>
                <li><strong>Création de compagnie</strong> : l'assistant de la compagnie franche, voir @UUID[Compendium.chiens-de-guerre.guide.JournalEntry.cdgGuide77vg8wUz.JournalEntryPage.atUkWWFtqc9vxOlx]{La compagnie franche}.</li>
              </ul>
              <p>
                Les deux assistants n'apparaissent qu'aux comptes qui ont le droit de créer des acteurs. Un joueur qui ne l'a pas voit à la place un message l'invitant à
                le demander au meneur (droit « Créer de nouveaux acteurs » dans la configuration des permissions).
              </p>
            </div>
          </div>

          <h2>Les types de documents</h2>
          <p>Le système définit trois types d'acteurs :</p>
          <ul>
            <li><strong>Personnage</strong> : un Marqué, joué par un joueur ;</li>
            <li><strong>PNJ / Créature</strong> : un adversaire, un allié, une bête ou un monstre, avec son bloc de statistiques ;</li>
            <li><strong>Compagnie franche</strong> : la compagnie commune aux joueurs, avec ses propres caractéristiques, compétences et blessés.</li>
          </ul>
          <p>Et six types d'objets :</p>
          <ul>
            <li><strong>Équipement</strong> : arme, armure, bouclier ou objet divers ;</li>
            <li><strong>Arcanum</strong> : un pouvoir physique (bonus constant) ou mystique (tours de magie par rang) ;</li>
            <li><strong>Trait spécial</strong> : un trait d'origine, un don de carrière ou une marque, avec ses effets ;</li>
            <li><strong>Peuple</strong>, <strong>Carrière</strong> et <strong>Ascendance</strong> : les origines du personnage, qui accordent traits, langues, compétences,
              arcanums et équipement quand on les dépose sur la fiche.</li>
          </ul>

          <h2>Les compendiums</h2>
          <div class="guide-row">
            <div class="guide-image guide-image-narrow"><img src="systems/chiens-de-guerre/assets/guide/compendiums.webp" alt="Compendiums du système" /></div>
            <div>
              <p>Le système est livré avec huit compendiums :</p>
              <ul>
                <li><strong>Peuples</strong> : les 8 peuples, avec leur ajustement de caractéristique, leurs langues et leurs traits ;</li>
                <li><strong>Traits spéciaux</strong> : les traits accordés par les peuples, effets compris ;</li>
                <li><strong>Carrières</strong> : les 15 carrières, avec leurs compétences, arcanums, équipement et argent de départ ;</li>
                <li><strong>Arcanums</strong> : les 22 arcanums, physiques et mystiques ;</li>
                <li><strong>Équipement</strong> : armes, armures, boucliers, paquetages et outils ;</li>
                <li><strong>Ascendances</strong> : l'origine de la Marque et sa compulsion ;</li>
                <li><strong>Bestiaire — PNJ / Créatures</strong> : PNJ types et créatures, réservé au meneur ;</li>
                <li><strong>Guide du système</strong> : ce guide.</li>
              </ul>
              <p>
                Peuples, carrières, ascendances et arcanums sont aussi proposés dans les listes de l'assistant de création, qu'ils soient dans un compendium ou dans les
                objets du monde.
              </p>
            </div>
          </div>
        </div>
