  - _id: Mhbx3hlIt28jYB7U
    name: PNJ et créatures
    type: text
    title:
      show: false
      level: 1
    image: {}
    text:
      format: 1
      content: |-
        <div class="cdg-guide">
          <h2>La fiche de PNJ / Créature</h2>
          <div class="guide-row">
            <div class="guide-image guide-image-half"><img src="systems/chiens-de-guerre/assets/guide/pnj-fiche.webp" alt="Fiche d'une créature" /></div>
            <div>
              <p>
                Le type <strong>PNJ / Créature</strong> reprend le bloc de statistiques du livre sur un seul écran : caractéristiques, compétences renseignées, blessures,
                initiative, armes et protections, arcanums et règles spéciales.
              </p>
              <ul>
                <li>
                  Les compétences de combat viennent en tête, puis les autres sous un filet. En consultation, seules celles dont le rang n'est pas nul sont affichées ; en
                  édition, les 31 sont accessibles.
                </li>
                <li>Un clic sur une caractéristique ou une compétence ouvre un test, comme sur la fiche de personnage.</li>
                <li>
                  Le nombre de cases de chaque gravité de blessure se règle à la main en mode édition : un PNJ n'a pas de rang de Vigueur qui les calcule.
                </li>
                <li>L'onglet <strong>Description</strong> porte la description et les <strong>notes privées</strong>, visibles des seuls propriétaires de la fiche.</li>
              </ul>
            </div>
          </div>

          <h2>PNJ majeur</h2>
          <div class="guide-row">
            <div class="guide-image guide-image-half"><img src="systems/chiens-de-guerre/assets/guide/pnj-edition.webp" alt="Fiche de PNJ en mode édition" /></div>
            <div>
              <p>
                La case <strong>PNJ majeur</strong> applique la règle d'effort du bestiaire. Un PNJ majeur a des réserves (valeur courante sur maximum) et peut investir de
                l'effort dans ses tests, comme un personnage. Les autres PNJ n'ont qu'une valeur par caractéristique et n'investissent aucun point.
              </p>
              <p>Les PNJ ne disposent pas de jetons de passion.</p>
            </div>
          </div>

          <h2>Combat</h2>
          <p>
            L'onglet Combat reprend les commandes de la fiche de personnage : <strong>Initiative</strong>, <strong>Esquiver</strong> avec sa piste de malus,
            <strong>Parer</strong> et sa parade du round, encaissement <i class="fa-solid fa-helmet-battle"></i>, et pour chaque arme ses boutons d'attaque et de dégâts
            (l'arme doit être tenue en main, <i class="fas fa-hand-fist"></i>). Les arcanums mystiques s'activent de la même façon. Voir @UUID[Compendium.chiens-de-guerre.guide.JournalEntry.cdgGuide77vg8wUz.JournalEntryPage.GdA29X6mS3ScAj1f]{Le combat}.
          </p>
          <p>
            Quand toutes ses cases de blessure mortelle sont cochées, un PNJ devient inconscient (statut du token) et sort du combat : il ne prend plus la main dans le suivi. Le rappel de survie de fin de round est réservé aux personnages des joueurs.
          </p>

          <h2>Le bestiaire</h2>
          <div class="guide-row">
            <div class="guide-image guide-image-half"><img src="systems/chiens-de-guerre/assets/guide/compendium-pnj.webp" alt="Compendium du bestiaire" /></div>
            <div>
              <p>
                Le compendium <strong>Bestiaire — PNJ / Créatures</strong>, réservé au meneur, range les PNJ types (soldats, archers, brigands, duellistes, officiers… en
                versions faible, moyenne et vétéran) et les créatures (animaux, morts-vivants, monstres).
              </p>
              <p>
                Glissez une entrée dans l'onglet Acteurs pour l'importer dans le monde, ou directement sur la scène pour poser un token. Modifiez ensuite la copie : le
                compendium reste intact.
              </p>
            </div>
          </div>
        </div>
