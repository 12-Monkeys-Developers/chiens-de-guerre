  - _id: GmNyKHhl8NNxO3ep
    name: Réglages
    type: text
    title:
      show: false
      level: 1
    image: {}
    text:
      format: 1
      content: |-
        <div class="cdg-guide">
          <h2>Les réglages du système</h2>
          <div class="guide-row">
            <div class="guide-image guide-image-half"><img src="systems/chiens-de-guerre/assets/guide/reglages.webp" alt="Réglages du système" /></div>
            <div>
              <p>Les réglages se trouvent dans <strong>Paramètres de jeu → Configurer les paramètres → Chiens de guerre</strong>. Ils concernent tout le monde.</p>
              <h3>Réinitialiser esquives et parade</h3>
              <p>
                Activé par défaut. À la fin de chaque round de combat, le compteur d'esquives et la parade de chaque combattant reviennent à zéro : la première esquive du
                round suivant redevient gratuite et la parade est de nouveau disponible. Désactivez-le si votre table préfère tenir ces compteurs à la main, depuis
                l'onglet Combat de chaque fiche.
              </p>
              <h3>Table des adversaires en bataille</h3>
              <p>
                Réservé au meneur : ouvre la table du tirage des adversaires en bataille, pour en changer les profils (voir @UUID[Compendium.chiens-de-guerre.guide.JournalEntry.cdgGuide77vg8wUz.JournalEntryPage.Bt7kQw2RzN4xLm9c]{Les batailles}).
              </p>
              <h3>Mode débogage</h3>
              <p>
                Désactivé par défaut, et propre à chaque poste : le Meneur peut l'activer chez lui sans toucher aux joueurs. Il affiche dans la console du navigateur (F12)
                le détail des jets (seuil, dés, dé conservé), des confrontations (étapes reçues, refus et leur raison, opposition, blessure appliquée), du combat
                (initiatives, main passée, nouveaux rounds), des blessures et du repos, des batailles, des origines posées ou retirées, et du contexte des fiches. Il sert
                à comprendre un résultat inattendu ou à signaler un problème ; il demande un rechargement de la page.
              </p>
            </div>
          </div>

          <h2>Avant la première partie</h2>
          <ul>
            <li>
              <strong>Droits des joueurs</strong> : pour utiliser l'assistant de création, un joueur doit pouvoir créer des acteurs (Paramètres de jeu → Configurer les
              permissions → « Créer de nouveaux acteurs »).
            </li>
            <li>
              <strong>Personnage attribué</strong> : attribuez à chaque joueur son personnage (Configuration du joueur → Personnage). C'est ce qui le fait apparaître dans
              le tableau de bord du meneur, et c'est l'acteur que visent les macros quand aucun token n'est sélectionné.
            </li>
            <li>
              <strong>Grille</strong> : une case du système vaut 1,5 m.
            </li>
          </ul>
        </div>
