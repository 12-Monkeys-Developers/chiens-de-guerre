  - _id: d6qJxIR42RlaHXOi
    name: Macros et outils du meneur
    type: text
    title:
      show: false
      level: 1
    image: {}
    text:
      format: 1
      content: |-
        <div class="cdg-guide">
          <h2>La barre de macros</h2>
          <div class="guide-image"><img src="systems/chiens-de-guerre/assets/guide/barre-macros.webp" alt="Barre de macros" /></div>
          <p>Glissez un élément de la fiche sur la barre de macros pour en faire un raccourci :</p>
          <ul>
            <li><strong>Caractéristique</strong> : son nom, dans l'en-tête — à tout moment ;</li>
            <li><strong>Compétence</strong> : son nom — en mode édition seulement, pour ne pas en saisir une par mégarde en jouant ;</li>
            <li>
              <strong>Arme</strong> : sa ligne dans l'onglet Combat. Un clic sur la macro lance l'attaque (une confrontation si une cible est désignée),
              <kbd>Maj</kbd>+clic lance les dégâts ;
            </li>
            <li><strong>Initiative</strong>, <strong>Esquiver</strong>, <strong>Parer</strong> et l'<strong>encaissement</strong> : leurs boutons dans l'onglet Combat.</li>
          </ul>
          <p>
            Une macro agit sur le token sélectionné, ou à défaut sur le personnage attribué au joueur. Une même macro sert donc à tout personnage qui a la même
            compétence ; seule la macro d'arme cherche d'abord l'arme d'origine, puis une arme du même nom sur l'acteur sélectionné.
          </p>

          <h2>Le tableau de bord des joueurs</h2>
          <div class="guide-image"><img src="systems/chiens-de-guerre/assets/guide/tableau-de-bord.webp" alt="Tableau de bord des joueurs" /></div>
          <p>
            Réservé au meneur, il s'ouvre depuis l'onglet <i class="fa-solid fa-flag-swallowtail"></i> de la barre latérale. Il liste, pour chaque joueur connecté qui a un
            personnage attribué : ses caractéristiques (réserve sur maximum), ses jetons de passion et ses blessures, avec le malus courant. Il se met à jour tout seul
            quand une fiche change ou qu'un joueur se connecte ; un clic sur le portrait ou le nom ouvre la fiche.
          </p>
          <p>
            Il est purement informatif : rien ne s'y modifie. Un joueur qui n'a pas de personnage attribué (Configuration du joueur → Personnage) n'y apparaît pas.
          </p>
        </div>
