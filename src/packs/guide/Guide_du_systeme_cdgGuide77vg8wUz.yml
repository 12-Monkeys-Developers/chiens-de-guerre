  - _id: 2wzFoVxI1eErVbzz
    name: Créer un Marqué
    type: text
    title:
      show: false
      level: 1
    image: {}
    text:
      format: 1
      content: |-
        <div class="cdg-guide">
          <h2>L'assistant de création</h2>
          <p>
            L'assistant conduit la création d'un Marqué en neuf étapes, dans l'ordre du livre. On l'ouvre depuis l'onglet <i class="fa-solid fa-flag-swallowtail"></i> de la barre
            latérale, bouton <strong>Création de personnage</strong>.
          </p>
          <ul>
            <li>Le bandeau du haut montre les neuf étapes : chacune est cliquable, et l'on revient librement en arrière pour changer un choix.</li>
            <li>
              Le pied de fenêtre dit ce qui manque à l'étape en cours, ou « Étape complète. », et compte les étapes achevées. <strong>Précédent</strong> et
              <strong>Suivant</strong> font avancer l'assistant ; <strong>Recommencer</strong> repart d'un brouillon vierge.
            </li>
            <li>
              Rien n'est écrit dans le monde avant le bouton final <strong>Créer votre personnage</strong> : tout se passe dans un brouillon. Fermer la fenêtre
              abandonne ce brouillon.
            </li>
            <li>
              Peuples, carrières, ascendances et arcanums se choisissent dans des listes qui réunissent les objets du monde et ceux des compendiums. On peut aussi déposer
              l'objet directement sur la fenêtre de l'assistant.
            </li>
          </ul>

          <h2>1. Caractéristiques</h2>
          <div class="guide-row">
            <div class="guide-image guide-image-half"><img src="systems/chiens-de-guerre/assets/guide/creation-caracteristiques.webp" alt="Étape des caractéristiques" /></div>
            <div>
              <p>
                Répartissez <strong>32 points</strong> entre <strong>Corps</strong>, <strong>Vivacité</strong> et <strong>Esprit</strong>, chacune entre <strong>8</strong> et
                <strong>12</strong>. Le compteur indique ce qui reste, ou ce qui dépasse.
              </p>
              <p>
                Les bonus du peuple et de la carrière s'ajoutent par-dessus, sans se prendre sur ces points : la colonne de droite montre la valeur qui sera inscrite sur la
                fiche.
              </p>
            </div>
          </div>

          <h2>2. Origine</h2>
          <div class="guide-row">
            <div class="guide-image guide-image-half"><img src="systems/chiens-de-guerre/assets/guide/creation-origine.webp" alt="Étape de l'origine" /></div>
            <div>
              <p>
                Choisissez le <strong>peuple</strong> dans la liste « Fiche de peuple ». L'assistant rappelle alors sa description, sa caractéristique augmentée et les
                traits spéciaux qu'il accorde. On peut aussi se contenter d'un nom, sans objet rattaché : le personnage n'aura alors ni bonus ni traits.
              </p>
              <p>
                Cochez ensuite les <strong>langues</strong> maîtrisées. Celles du peuple sont acquises et ne se décochent pas ; toute autre coûte
                <strong>2 points de personnalisation</strong> (étape 7).
              </p>
            </div>
          </div>

          <h2>3. Carrière et grade</h2>
          <div class="guide-row">
            <div class="guide-image guide-image-half"><img src="systems/chiens-de-guerre/assets/guide/creation-carriere.webp" alt="Étape de la carrière" /></div>
            <div>
              <p>
                La <strong>carrière</strong> accorde un ajustement de caractéristique, des rangs de compétence minimaux, ses arcanums et son paquetage de départ. Sa
                description s'affiche sous la liste.
              </p>
              <p>Le <strong>grade</strong> fixe la solde mensuelle :</p>
              <ul>
                <li><strong>Duplicator</strong> : grade d'entrée, gratuit, 12 D par mois ;</li>
                <li><strong>Sergent</strong> : 5 points de personnalisation, 18 D par mois ;</li>
                <li><strong>Lieutenant</strong> : inaccessible à la création.</li>
              </ul>
              <p>Le Chroniqueur, l'Émissaire et l'Officier commencent sergents : la promotion leur est offerte.</p>
            </div>
          </div>

          <h2>4. Ascendance</h2>
          <div class="guide-row">
            <div class="guide-image guide-image-half"><img src="systems/chiens-de-guerre/assets/guide/creation-ascendance.webp" alt="Étape de l'ascendance" /></div>
            <div>
              <p>
                L'<strong>ascendance</strong> est l'origine surnaturelle de la Marque. Chacune porte sa <strong>compulsion</strong>, la faille morale du personnage, que
                l'assistant affiche avec sa description.
              </p>
              <p>
                Certaines ascendances proposent jusqu'à quatre <strong>arcanums candidats</strong> : l'un d'eux s'acquiert gratuitement à l'étape 7.
              </p>
            </div>
          </div>

          <h2>5. Compétences</h2>
          <div class="guide-row">
            <div class="guide-image guide-image-half"><img src="systems/chiens-de-guerre/assets/guide/creation-competences.webp" alt="Étape des compétences" /></div>
            <div>
              <p>
                Vous disposez de <strong>10 points</strong> pour améliorer les 31 compétences. Cliquez sur un écusson pour fixer le rang. Les coûts se cumulent : le rang 1
                coûte 1 point, le rang 2 en coûte 2 de plus, soit 3 points depuis rien.
              </p>
              <ul>
                <li>Les rangs accordés par la carrière sont gratuits et verrouillés.</li>
                <li>À cette étape, une compétence ne dépasse pas le <strong>rang 2</strong> : le rang 3 s'achète à l'étape 7.</li>
                <li>
                  Si vous dépensez plus de 10 points, le surplus est pris sur les points de personnalisation : le compteur le signale.
                </li>
                <li>Un trait d'origine comme <em>Industrieux</em> accorde des compétences au rang 1 sans frais ; le compteur indique combien il en reste à choisir.</li>
              </ul>
            </div>
          </div>

          <h2>6. Traits de personnalité</h2>
          <div class="guide-row">
            <div class="guide-image guide-image-half"><img src="systems/chiens-de-guerre/assets/guide/creation-traits.webp" alt="Étape des traits" /></div>
            <div>
              <p>Chacun des <strong>17 couples</strong> de traits oppose un vice à une vertu. Cliquez sur une case pour rendre ce côté dominant à ce rang :</p>
              <ul>
                <li>chaque couple reçoit un trait dominant, au moins au rang 1 ;</li>
                <li>5 à 10 traits montent au <strong>rang 2</strong> ;</li>
                <li>0 à 2 d'entre eux vont jusqu'au <strong>rang 3</strong> (un trait au rang 3 compte aussi parmi ceux du rang 2).</li>
              </ul>
              <p>Les totaux de vices et de vertus, le <strong>karma</strong> et l'<strong>allégeance</strong> qui en découle se mettent à jour à chaque clic.</p>
              <p>Recliquer sur la case courante libère le couple.</p>
            </div>
          </div>

          <h2>7. Personnalisation</h2>
          <div class="guide-row">
            <div class="guide-image guide-image-half"><img src="systems/chiens-de-guerre/assets/guide/creation-personnalisation.webp" alt="Étape de la personnalisation" /></div>
            <div>
              <p>
                <strong>15 points de personnalisation</strong> (plus ceux qu'accorde un trait comme <em>Versatilité</em>) affinent le personnage. Le récapitulatif du haut
                montre où ils sont partis ; un lien ramène à l'étape où se fait chaque choix.
              </p>
              <ul>
                <li><strong>Augmenter une caractéristique</strong> : +1 pour 5 points, une fois par caractéristique. La première case d'amélioration de la fiche est cochée.</li>
                <li><strong>Améliorer une compétence</strong> : rangs 1, 2 et 3 pour 1, 2 et 4 points. Une seule compétence peut finir au rang 3.</li>
                <li><strong>Acquérir un arcanum</strong> : 7 points par rang, jamais au rang 3 en début de partie.</li>
                <li><strong>Bonus de l'ascendance</strong> : un des arcanums candidats, gratuit, acquis au rang 1 ou monté au rang 2 s'il est déjà connu.</li>
                <li><strong>Langues</strong> et <strong>promotion</strong> : déjà choisies aux étapes 2 et 3, elles sont décomptées ici.</li>
                <li><strong>Pécule</strong> : chaque point investi rapporte 10 ducats.</li>
              </ul>
            </div>
          </div>

          <h2>8. Touches finales</h2>
          <div class="guide-row">
            <div class="guide-image guide-image-half"><img src="systems/chiens-de-guerre/assets/guide/creation-touches-finales.webp" alt="Étape des touches finales" /></div>
            <div>
              <ul>
                <li><strong>Blessures</strong> : les cases découlent du rang de Vigueur, et des traits qui en ajoutent.</li>
                <li>
                  <strong>Confession</strong> : Tyvardisme, Miravisme, Caedisme, ou aucune religion. Un aumônier ne peut pas rester sans allégeance spirituelle.
                </li>
                <li><strong>Bourse</strong> : ce qui reste, argent de la carrière et pécule compris.</li>
                <li>
                  <strong>Équipement de départ</strong> : le paquetage de la carrière. Quand la carrière offre un choix (« arme ou bouclier »), les deux objets sont
                  proposés : retirez celui que vous ne prenez pas avec la croix.
                </li>
                <li>
                  Déposez sur la zone prévue des armes, protections ou arcanums supplémentaires, depuis la barre latérale ou un compendium : leur prix est déduit de la
                  bourse.
                </li>
              </ul>
            </div>
          </div>

          <h2>9. Identité</h2>
          <div class="guide-row">
            <div class="guide-image guide-image-half"><img src="systems/chiens-de-guerre/assets/guide/creation-identite.webp" alt="Étape de l'identité" /></div>
            <div>
              <ul>
                <li><strong>Surnom</strong> (obligatoire) : le nom de l'acteur, celui par lequel la compagnie vous appelle.</li>
                <li><strong>Vrai nom</strong> et <strong>portrait</strong> (clic sur l'image).</li>
                <li><strong>Traits spéciaux</strong> : la description de la Marque, reportée dans les traits spéciaux de la fiche.</li>
                <li><strong>Origine et histoire</strong> : elle devient la biographie du personnage.</li>
              </ul>
              <p>
                Le <strong>résumé</strong> reprend tous les choix et signale les étapes laissées en plan. <strong>Créer votre personnage</strong> crée l'acteur et ouvre sa
                fiche ; si des étapes sont incomplètes, l'assistant demande confirmation et le personnage est créé tel quel, à finir sur sa fiche.
              </p>
            </div>
          </div>
        </div>
