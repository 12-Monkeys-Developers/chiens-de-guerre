system:
  description: >-
    <p>Les Marqués qui développent Dextem bénéficient d’une précision hors norme
    lors des combats : leurs coups sont parfaitement ajustés et capables de
    trouver la moindre faille dans les défenses de leurs adversaires. Pour
    chaque rang possédé dans cet Arcanum, le personnage bénéficie d’un + 2 à
    tous les tests d’attaque au corps-à-corps, que ce soit avec une arme ou à
    mains nues.</p><h4>Lumière / Balance</h4><p>Le Marqué gagne en outre un
    bonus de + 1 par rang sur tous les tests créatifs ou bénéfiques mettant en
    jeu le doigté. C’est typiquement le cas pour l’artisanat et les premiers
    soins.</p><h4>Obscurité</h4><p>Le Marqué bénéficie par ailleurs d’un bonus
    de + 1 par rang sur tous les tests (autres que ceux d’attaque) visant à
    détruire, détériorer ou nuire et impliquant principalement la dextérité,
    comme le pickpocket, le crochetage de serrures ou le désamorçage de
    pièges.</p>
