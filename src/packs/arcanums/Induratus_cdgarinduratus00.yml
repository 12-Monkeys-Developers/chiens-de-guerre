system:
  description: >-
    <p>En développant Induratus, un Marqué peut endurer des coups terribles sans
    subir la moindre éraflure, mais aussi résister aux pires épreuves. Pour
    chaque rang possédé dans cet Arcanum, le personnage bénéficie d’un + 2 à
    tous les tests de résistance aux dommages.</p><h4>Lumière</h4><p>Le Marqué
    gagne en outre un bonus de + 1 par rang sur tous les tests visant à endurer
    les privations ou les sévices, que ce soit la fatigue, la faim, la soif ou
    la torture.</p><h4>Balance / Obscurité</h4><p>Le Marqué bénéficie par
    ailleurs d’un bonus de + 1 par rang sur tous les tests visant à résister aux
    effets des maladies ou des poisons.</p>
