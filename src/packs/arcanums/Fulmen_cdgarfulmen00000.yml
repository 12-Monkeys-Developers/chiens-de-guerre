system:
  description: >-
    <p>L’Arcanum Fulmen octroie une vitesse d’action hors du commun. Le
    personnage devient capable de réaliser des mouvements à une vitesse
    surnaturelle ; ses réflexes deviennent prodigieux. Pour chaque rang possédé
    dans cet Arcanum, le personnage bénéficie d’un + 2 à tous les tests
    d’initiative.</p><h4>Lumière / Balance</h4><p>Le Marqué bénéficie par
    ailleurs d’un bonus de + 1 par rang sur tous les tests de course sur de
    courtes distances (sprint) : il est rapide, mais pas forcément
    endurant.</p><h4>Obscurité</h4><p>Le Marqué bénéficie par ailleurs d’un
    bonus de + 1 par rang sur tous les tests visant à éviter d’être pris par
    surprise : ses réflexes sont extraordinaires.</p>
