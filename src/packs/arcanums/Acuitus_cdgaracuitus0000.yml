system:
  description: >-
    <p>Un œil vif et un geste adroit suffisent à un archer pour transpercer
    mortellement un homme. Acuitus offre une acuité sensorielle supérieure à
    celle des animaux les mieux dotés par la nature. Pour chaque rang possédé
    dans cet Arcanum, le personnage bénéficie d’un + 2 à tous les tests
    d’attaque avec une arme à distance (tir ou jet).</p><h4>Balance /
    Lumière</h4><p>Doté d’une vue perçante, le Marqué bénéficie par ailleurs
    d’un bonus de + 1 par rang sur tous les tests de perception (vigilance,
    investigation, etc.) mettant largement en jeu la
    vision.</p><h4>Obscurité</h4><p>Le Marqué bénéficie également d’un bonus de
    + 1 par rang sur tous les tests de perception (vigilance, investigation,
    etc.) mettant largement en jeu l’audition, le toucher et/ou l’odorat.</p>
