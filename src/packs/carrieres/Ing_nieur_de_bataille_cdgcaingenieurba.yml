system:
  description: >-
    <p>Les ingénieurs de bataille sont les spécialistes de la construction
    d'ouvrages militaires (et par extension de la sape) ainsi que du bon usage
    de l'artillerie. Ils sont essentiels pour correctement défendre des places
    fortes, mais aussi et surtout pour les prendre, notamment lors de sièges,
    dans lesquels ils excellent particulièrement.</p><h4>Au
    choix</h4><ul><li>Arme de corps-à-corps légère (dégâts 1) <em>ou</em> arme
    de corps-à-corps moyenne (dégâts 2).</li></ul>
