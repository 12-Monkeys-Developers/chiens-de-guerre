_id: cdgcaemissaire00
name: Émissaire
type: carriere
img: icons/skills/trades/smithing-anvil-silver-red.webp
system:
  description: >-
    <p>Les émissaires sont des hommes et des femmes de confiance choisis pour
    leur loyauté autant que pour leur discernement. Ils portent la parole de la
    compagnie et, à travers elle, son honneur.</p><p>La confiance considérable
    qu'on leur accorde, conjuguée à une large autonomie d'action, se traduit par
    un grade honorifique, marque officielle de l'autorité qui lui est
    déléguée.</p><h4>Au choix</h4><ul><li>Paquetage de voyageur <em>ou</em>
    paquetage d'érudit.</li><li>Arme de corps-à-corps légère (dégâts 1)
    <em>ou</em> arme de corps-à-corps moyenne (dégâts 2).</li><li>Cheval de
    selle, ou garguant de selle si le personnage est
    nain.</li></ul><h4>Spécial</h4><p>Vous commencez avec le grade de
    Sergent.</p>
