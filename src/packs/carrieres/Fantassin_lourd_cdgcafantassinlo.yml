_id: cdgcafantassinlo
name: Fantassin lourd
type: carriere
img: icons/skills/trades/smithing-anvil-silver-red.webp
system:
  description: >-
    <p>Forts d'une discipline de fer, d'un équipement supérieur et d'une volonté
    inébranlable, les fantassins lourds constituent l'élite des champs de
    bataille. Spécialisés dans les affrontements en formation serrée, ils
    excellent dans les batailles rangées, où cohésion et endurance priment sur
    la vitesse.</p><p>Un fantassin lourd Marqué est capable, à lui seul, de
    tenir en respect un groupe d'adversaires mal discipliné ou peu entraîné.
    Habitué au fracas du métal et aux cris des mourants, il avance là où
    d'autres hésitent, tenant la ligne coûte que coûte.</p><h4>Au
    choix</h4><ul><li>Arme de corps-à-corps lourde (dégâts 3) <em>ou</em> arme
    de corps-à-corps moyenne (dégâts 2) et bouclier lourd (init - 2, blocage +
    4).</li></ul>
