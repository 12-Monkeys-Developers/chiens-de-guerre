_id: cdgcamaitrearmes
name: Maître d'armes
type: carriere
img: icons/skills/trades/smithing-anvil-silver-red.webp
system:
  description: >-
    <p>Certains soldats finissent toujours par se hisser au-dessus des autres
    via leurs prouesses martiales. Les maîtres d'armes sont ceux que tous
    reconnaissent pour leur habileté à l'arme à la main.</p><p>On leur confie
    souvent l'entraînement des recrues, qu'elles soient novices ou
    expérimentées, ainsi que la conduite des duels d'honneur ou judiciaires que
    la compagnie franche pourrait avoir à affronter.</p><h4>Au
    choix</h4><ul><li>Arme de corps-à-corps légère (dégâts 1) <em>ou</em>
    bouclier léger (blocage + 2).</li></ul>
