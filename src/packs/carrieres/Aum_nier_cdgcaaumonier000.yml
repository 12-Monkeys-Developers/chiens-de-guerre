_id: cdgcaaumonier000
name: Aumônier
type: carriere
img: icons/skills/trades/smithing-anvil-silver-red.webp
system:
  description: >-
    <p>Les horreurs de la guerre, celles auxquelles on assiste comme celles que
    l'on commet, mettent à rude épreuve l'âme des mercenaires. L'aumônier
    accompagne ses frères Marqués dans l'adversité : il les guide
    spirituellement, célèbre les offices et veille à la cohésion morale de la
    troupe.</p><p>Le soutien qu'il apporte ne l'exempte nullement des réalités
    du champ de bataille. Au contraire, c'est en partageant les dangers, la boue
    et le sang qu'il gagne la légitimité nécessaire à sa fonction.</p><p>Il est
    courant qu'un aumônier conseille directement le commandement. Il est sage
    que la hiérarchie tienne compte de ses avis…</p><h4>Au
    choix</h4><ul><li>Arme de corps-à-corps légère (dégâts 1) <em>ou</em> arme
    de corps-à-corps moyenne (dégâts 2).</li></ul><h4>Spécial</h4><p>Un aumônier
    est de confession tyvardique, miravique ou caedique. Il s'agit généralement
    de la foi dominante au sein de la compagnie.</p>
