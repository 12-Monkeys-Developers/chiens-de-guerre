name: Devin
type: carriere
img: icons/skills/trades/smithing-anvil-silver-red.webp
system:
  description: >-
    <p>Le devin est un magicien doté du don de « double-vue ». Il sait
    interpréter les présages, sonder des événements révolus et entrevoir des
    réalités distantes (parfois dans l'espace, parfois dans le temps).</p><p>Aux
    yeux de nombre de ses frères d'armes, il demeure au mieux étrange, au pire
    inquiétant. Pourtant, ses talents s'avèrent inestimables : les gradés ne
    manquent jamais de le consulter avant de prendre des décisions lourdes de
    conséquences.</p><p>Certains devins sont des mystiques profanes,
    autodidactes ou initiés à des traditions ésotériques obscures ; d'autres se
    présentent comme des prophètes rattachés à l'une des grandes
    religions.</p><h4>Au choix</h4><ul><li>Le matériel de divination est au
    choix du personnage : chapelet, jeu de cartes, pierres runiques,
    etc.</li></ul>
