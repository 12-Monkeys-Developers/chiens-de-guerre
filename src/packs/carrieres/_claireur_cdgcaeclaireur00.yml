_id: cdgcaeclaireur00
name: Éclaireur
type: carriere
img: icons/skills/trades/smithing-anvil-silver-red.webp
system:
  description: >-
    <p>Les éclaireurs constituent l'indispensable avant-garde d'une armée.
    Guides expérimentés, chasseurs patients ou espions discrets, ils veillent à
    ce que les troupes ne tombent pas dans une embuscade ni dans
    l'égarement.</p><p>Habitués à lire les traces, à interpréter les signes du
    terrain et à anticiper les mouvements ennemis, ils sont les yeux et les
    oreilles de la compagnie franche. Il n'est pas rare qu'ils assurent
    également le ravitaillement, passant de longues heures à chasser, pister ou
    cueillir.</p>
