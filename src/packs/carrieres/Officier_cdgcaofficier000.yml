_id: cdgcaofficier000
name: Officier
type: carriere
img: icons/skills/trades/smithing-anvil-silver-red.webp
system:
  description: >-
    <p>Les frères d'armes ont besoin d'individus charismatiques et exigeants
    pour imposer l'ordre et la discipline. Les officiers des compagnies franches
    dirigent généralement leurs troupes d'une poigne de fer plutôt qu'avec un
    gant de velours.</p><p>La plupart des officiers proviennent de milieux
    privilégiés : bourgeoisie solidement établie, petite noblesse ou encore
    bâtard issu d'une lignée prestigieuse.</p><h4>Au choix</h4><ul><li>Arme de
    corps-à-corps lourde (dégâts 3) <em>ou</em> arme de corps-à-corps moyenne
    (dégâts 2).</li><li>Bouclier léger (blocage + 2) <em>ou</em> bouclier lourd
    (init - 2, blocage + 4).</li></ul><h4>Spécial</h4><p>Vous commencez avec le
    grade de Sergent. Vous pouvez choisir à la place le grade de Lieutenant pour
    un coût de 10 points de personnalisation lors de la création de
    personnage.</p>
