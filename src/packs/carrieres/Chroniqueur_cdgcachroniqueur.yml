_id: cdgcachroniqueur
name: Chroniqueur
type: carriere
img: icons/skills/trades/smithing-anvil-silver-red.webp
system:
  description: >-
    <p>Le chroniqueur, un rôle unique dans chaque compagnie franche, est chargé
    de tenir les Annales de la compagnie, dans lesquelles il consigne
    quotidiennement les faits et gestes de ses frères d'armes.</p><p>Ce
    manuscrit est transmis de chroniqueur en chroniqueur, précieusement conservé
    afin qu'aucun compagnon ne sombre dans l'oubli, quand bien même il serait
    mort depuis des décennies.</p><p>Le chroniqueur bénéficie d'un grade
    honorifique reflétant l'importance de sa fonction mémorielle. Dans de
    nombreuses compagnies, la lecture publique d'extraits choisis des Annales
    est institutionnalisée.</p><h4>Au choix</h4><ul><li>Arme de corps-à-corps
    légère (dégâts 1) <em>ou</em> arme de corps-à-corps moyenne (dégâts
    2).</li></ul><h4>Spécial</h4><p>Vous commencez avec le grade de Sergent.</p>
