  description: >-
    <p>Obémon n'est pas le dieu de l'Obscurité sans raison : les sombres arts
    consistant à manipuler la mort elle-même sont jalousement gardés par ses
    serviteurs. Quelques rares Marqués eurent la chance de bénéficier des
    enseignements dans ce domaine auprès des Oblitérés eux-mêmes.</p><p>Cette
    forme de magie, bien qu'elle doive rester dissimulée, constitue un atout
    majeur que seules les compagnies franches savent exploiter, c'est un
    avantage dont elles ne sauraient se priver.</p>
