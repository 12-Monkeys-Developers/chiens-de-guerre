_id: cdgcabarbierchir
name: Barbier-chirurgien
type: carriere
img: icons/skills/trades/smithing-anvil-silver-red.webp
system:
  description: >-
    <p>Les aléas de la guerre et les soins constants qu'exigent des hommes
    contraints de parcourir de longues distances à pied et de survivre dans des
    conditions éprouvantes font du barbier-chirurgien une figure majeure de la
    compagnie franche.</p><p>Bien peu de frères d'armes peuvent se targuer de ne
    jamais avoir eu recours à ses bons services, que ce soit aussi conséquent
    que de lui devoir la vie ou d'avoir été soulagé d'un mal plus
    trivial.</p><p>Le barbier-chirurgien assure les soins quotidiens des hommes
    : il taille les barbes, réduit les fractures, cautérise les plaies et
    prépare onguents et décoctions.</p><h4>Au choix</h4><ul><li>Arme de
    corps-à-corps légère (dégâts 1) <em>ou</em> arme de corps-à-corps moyenne
    (dégâts 2).</li></ul>
