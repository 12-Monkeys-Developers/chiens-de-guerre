system:
  description: >-
    <p>Qu'ils soient archers ou arbalétriers, les soldats experts dans les armes
    à distance forment un corps de troupe particulièrement redoutable aussi bien
    dans les batailles rangées que dans les embuscades. Les tireurs d'élite
    comptent parmi les combattants les plus dangereux dans leur domaine
    d'expertise.</p><h4>Au choix</h4><ul><li>Arme de tir lourde (dégâts 3,
