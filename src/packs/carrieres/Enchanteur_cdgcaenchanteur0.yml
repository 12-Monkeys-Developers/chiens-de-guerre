_id: cdgcaenchanteur0
name: Enchanteur
type: carriere
img: icons/skills/trades/smithing-anvil-silver-red.webp
system:
  description: >-
    <p>Les enchanteurs sont des mages spécialisés dans l'art des charmes et des
    envoûtements, capables d'insuffler la magie aussi bien dans les objets que
    dans les êtres vivants.</p><p>Habiles dans la manipulation des glyphes, des
    sceaux et des substances alchimiques, ils façonnent des effets durables là
    où d'autres mages ne produisent que des manifestations éphémères.</p><p>Au
    sein d'une compagnie franche, l'enchanteur constitue un atout précieux : il
    renforce les armes, protège les armures, apaise les esprits troublés ou
    affaiblit subtilement les adversaires. Les plus expérimentés peuvent même
    façonner de rares objets magiques, véritables trésors très convoités (et
    parfois craints) pour la puissance qu'ils renferment.</p>
