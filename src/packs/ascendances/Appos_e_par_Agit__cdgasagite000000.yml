system:
  description: >-
    <p>Excentrique et faste, Agité n'en est pas moins un formidable combattant
    et un duelliste hors pair. Sa magie lui permet d'altérer le hasard et les
    fils de la destinée. Après avoir conquis le pays de Tuhée, il en a
    méthodiquement pillé les richesses et ressources.</p>
  compulsion: Cupidité
  compulsionDesc: >-
    <p>Vous convoitez les richesses, aimez les biens matériels et ne pensez la
    plupart du temps qu'à l'argent. Ceci peut faire de vous un kleptomane ou un
    détrousseur sans foi ni loi. Certains deviennent avares à l'excès. D'autres,
    encore, en arrivent à concevoir un désir incontrôlable pour une chose
    inaccessible.</p>
